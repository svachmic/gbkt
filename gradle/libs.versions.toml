[versions]
json = "20251224"
# Formatter shared by every spotless block, including the gbkt-gradle-plugin composite
# build (which imports this catalog through its own settings.gradle.kts).
ktfmt = "0.63"
kotest = "5.9.1"
coroutines = "1.9.0"
coffeegb = "1.6.0"
junit4 = "4.13.2"
mcp-sdk = "0.13.0"
# gbkt-mcp-server pins a newer coroutines line than the shared `coroutines` version used by
# gbkt-core tests. Kept separate to preserve exact resolution; unify when convenient.
coroutines-mcp = "1.10.1"
serialization-json = "1.8.1"
kotlinx-io = "0.7.0"
slf4j = "2.0.17"
# Plugin versions — single bump point for each tool
kotlin = "2.3.20"
junit = "5.11.4"
spotless = "8.6.0"
detekt = "1.23.8"
sonarqube = "7.3.1.8318"
kover = "0.9.4"
plugin-publish = "1.3.1"
shadow = "9.0.0-beta12"
intellij-platform = "2.10.5"

[libraries]
json = { module = "org.json:json", version.ref = "json" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
coffeegb-core = { module = "eu.rekawek.coffeegb:core", version.ref = "coffeegb" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
mcp-kotlin-sdk = { module = "io.modelcontextprotocol:kotlin-sdk", version.ref = "mcp-sdk" }
mcp-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines-mcp" }
mcp-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines-mcp" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
# JUnit 5 — governed by junit-bom platform; module refs are intentionally versionless
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Single bump point: both jvm and serialization use the same kotlin version ref.
# This intentionally upgrades serialization 2.3.0 -> 2.3.20 to match the Kotlin compiler.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
