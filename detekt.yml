build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    # severity (low = 1, medium = 2, high = 3) = weights

config:
  validation: true
  warningsAsErrors: false
  excludes: ''

complexity:
  LongMethod:
    active: true
    threshold: 80  # DSL builders get long
    excludes:
      - '**/codegen/**'  # Codegen methods generate C code strings
      - '**/test/**'  # Test files can have long test methods
      - '**/ir/**'  # IR transformation methods are inherently long
      - '**/validation/**'  # Validation functions check many cases
      - '**/collision/**'  # Collision math requires many steps
      - '**/CodeGenerator.kt'  # Main generator orchestrates many codegen calls
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
    excludes:
      - '**/entity/**'  # Entity data classes have many components
      - '**/rpg/**'  # RPG data classes have many fields
      - '**/ui/**'  # UI data classes have many properties
      - '**/test/**'  # Test simulation classes have many fields
      - '**/world/**'  # Floor data classes have many fields
      - '**/exploration/**'  # Exploration config has many fields
      - '**/builder/**'  # Builder classes have many configuration options
      - '**/collision/**'  # Collision functions need position/velocity params
      - '**/validation/**'  # Validation passes many context params
      - '**/combat/**'  # Battle engine configs have many options
      - '**/movement/**'  # Movement controller configs have many options
  ComplexCondition:
    active: false  # IR generation is inherently nested
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 5
    excludes:
      - '**/codegen/**'  # Codegen files legitimately have many functions
      - '**/ir/**'  # IR wrapper classes have many operator overloads
      - '**/test/**'  # Test helper classes have many assertion methods
      - '**/builder/**'  # Builder classes have many configuration methods
      - '**/scene/**'  # Scene transition scope has many transition types
      - '**/graphics/**'  # Camera has many methods for different operations
      - '**/world/**'  # Tile/zone builders have many configuration methods
      - '**/CodeGenerator.kt'  # Main generator orchestrates codegen and multi-file split
  LargeClass:
    active: true
    threshold: 600
    excludes:
      - '**/codegen/**'  # Codegen files may exceed for complex systems
      - '**/test/**'  # Test classes can be large with many test cases
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
    ignoreNestingFunctions: false
    nestingFunctions: []
    excludes:
      - '**/codegen/**'  # Codegen has complex when expressions
      - '**/ir/**'  # IR substitution/deepCopy inherently complex
      - '**/optimization/**'  # Optimization logic is complex
      - '**/validation/**'  # Validation has complex branching
      - '**/collision/**'  # Collision math is complex
  NestedBlockDepth:
    active: true
    threshold: 5  # DSL builders can be nested
    excludes:
      - '**/codegen/**'  # C code generation has deep nesting
      - '**/validation/**'  # Validation logic has deep nesting
      - '**/collision/**'  # Collision math has deep nesting

style:
  MagicNumber:
    active: false  # Game development uses many coordinate and color values
  UnusedPrivateMember:
    active: false  # DSL receivers trigger false positives
  UnusedPrivateProperty:
    active: false  # DSL builders may have unused properties that are needed for API
  ForbiddenComment:
    active: false  # TODO/FIXME are fine
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
    excludeRawStrings: true
    excludes:
      - '**/test/**'  # Test files can have long assertion messages
      - '**/commonTest/**'
      - '**/codegen/**'  # Codegen files generate C code strings
  UnusedParameter:
    active: true
    excludes:
      - '**/codegen/**'  # Callback parameters needed for interface compliance
      - '**/dsl/**'  # DSL callback parameters for future expansion
      - '**/rpg/**'  # Callback placeholders
      - '**/flow/**'  # Flow callback parameters
      - '**/ui/**'  # Menu callback parameters
      - '**/scene/**'  # Scene callback parameters
  WildcardImport:
    active: true
    excludes:
      - '**/test/**'  # Test files use wildcards for brevity
      - '**/commonTest/**'
    excludeImports:
      - 'java.util.*'
      - 'kotlinx.coroutines.*'
      - 'kotlin.test.*'  # Allowed in test files for brevity
  ReturnCount:
    active: true
    max: 4
    excludedFunctions:
      - 'equals'
      - 'canAfford'  # Resource cost checking has multiple early returns
    excludeLabeled: true
    excludeReturnFromLambda: true
    excludeGuardClauses: true
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 1
    excludes:
      - '**/codegen/**'  # Complex loop-based C code generation
      - '**/AssetPipeline.kt'  # Asset parsing with early exits
  FunctionOnlyReturningConstant:
    active: true
    ignoreOverridableFunction: true
    ignoreActualFunction: true
    excludes:
      - '**/codegen/**'  # Codegen pattern matching returns null for no-match
  ThrowsCount:
    active: true
    max: 4
    excludeGuardClauses: true

naming:
  InvalidPackageDeclaration:
    active: false  # Sample games may use simplified package structure
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'  # Allow u8(), i16(), etc.
    excludeClassPattern: '$^'
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
    privateVariablePattern: '(_)?[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'Exception'
      - 'IllegalMonitorStateException'
      - 'NullPointerException'
      - 'IndexOutOfBoundsException'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - 'Error'
      - 'Exception'
      - 'Throwable'
      - 'RuntimeException'
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
    allowedExceptionNameRegex: '_|(ignore|expected).*'

empty-blocks:
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'

potential-bugs:
  EqualsWithHashCodeExist:
    active: true
  InvalidRange:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  UselessPostfixExpression:
    active: true
