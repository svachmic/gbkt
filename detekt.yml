build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    # severity (low = 1, medium = 2, high = 3) = weights

config:
  validation: true
  warningsAsErrors: false
  excludes: ''

performance:
  SpreadOperator:
    active: true
    excludes:
      - '**/intellij/inspections/**'  # IntelliJ API requires vararg spread
      - '**/test/**'  # Test code prioritizes readability over perf — spread is idiomatic for varargs forwarding
      - '**/gradle/**'  # Gradle task ProcessBuilder invocations pass CLI argument arrays via spread (lcc/png2asset args) — ProcessBuilder requires Array<String> and spread is the idiomatic Kotlin conversion from a list of args

complexity:
  LongMethod:
    active: true
    threshold: 80  # DSL builders get long
    excludes:
      - '**/codegen/**'  # Codegen methods generate C code strings
      - '**/test/**'  # Test files can have long test methods
      - '**/ir/**'  # IR transformation methods are inherently long
      - '**/validation/**'  # Validation functions check many cases
      - '**/collision/**'  # Collision math requires many steps
      - '**/CodeGenerator.kt'  # Main generator orchestrates many codegen calls
      - '**/dsl/**'  # DSL GameBuilder.build() accumulates all IR fields per feature
      - '**/mcp/**'  # MCP tool registration block (registerEmulatorTools) and per-tool dispatch (batchAssert) are inherently large
      - '**/gradle/**'  # Gradle task execute() methods orchestrate multi-step build pipelines (sprite conversion, tileset processing, ROM compilation, asset generation) — inherently long; same rationale as codegen/**. GbktPlugin.registerTasks() registers 12+ tasks with complex afterEvaluate wiring — unavoidably long orchestration method
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
    excludes:
      - '**/entity/**'  # Entity data classes have many components
      - '**/rpg/**'  # RPG data classes have many fields
      - '**/ui/**'  # UI data classes have many properties
      - '**/test/**'  # Test simulation classes have many fields
      - '**/world/**'  # Floor data classes have many fields
      - '**/exploration/**'  # Exploration config has many fields
      - '**/builder/**'  # Builder classes have many configuration options
      - '**/collision/**'  # Collision functions need position/velocity params
      - '**/codegen/**'  # Codegen helpers naturally take many inputs (positions, hitboxes, expressions) — parallels '**/collision/**'
      - '**/validation/**'  # Validation passes many context params
      - '**/combat/**'  # Battle engine configs have many options
      - '**/movement/**'  # Movement controller configs have many options
      - '**/gradle/**'  # Gradle task helper functions (convertOneTileset, buildPng2AssetArgs, synthesizeHeader) receive all pipeline context as explicit params to avoid Gradle task-state mutation — inherently high parameter count; parallels codegen/**
  ComplexCondition:
    active: true
    excludes:
      - '**/codegen/**'  # Codegen condition trees generate multi-branch C dispatch — metric pressure adds no value here
      - '**/ir/**'  # IR visitor dispatch is inherently nested; exclusion mirrors LongMethod rationale
      - '**/intellij/editors/**'  # Swing visual editors: bounds-check conditions for tile-grid hit-testing (x<0 || x>=w || y<0 || y>=h) and path-heuristic checks are inherently 4-clause predicates; the meaning is clearer inline than split across named booleans
      - '**/intellij/editors/sprite/**'  # Sprite editor hit-test bounds checks — same rationale as intellij/editors/**
      - '**/gradle/**'  # Gradle task conditionals check filesystem state, OS platform, tool availability, and CLI output codes in compound guards — 4-clause conditions are the natural form; splitting to named booleans would obscure the guard intent
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 5
    excludes:
      - '**/codegen/**'  # Codegen files legitimately have many functions
      - '**/ir/**'  # IR wrapper classes have many operator overloads
      - '**/test/**'  # Test helper classes have many assertion methods
      - '**/builder/**'  # Builder classes have many configuration methods
      - '**/dsl/**'  # DSL top-level builder (GameBuilder) accumulates one entry point per DSL feature
      - '**/scene/**'  # Scene transition scope has many transition types
      - '**/graphics/**'  # Camera has many methods for different operations
      - '**/world/**'  # Tile/zone builders have many configuration methods
      - '**/CodeGenerator.kt'  # Main generator orchestrates codegen and multi-file split
      - '**/analysis/passes/**'  # Validation passes have many small per-diagnostic check helpers (parallel to codegen)
      - '**/mcp/**'  # MCP server has one handler method per exposed tool
      - '**/emulator/agent/**'  # Agent classes (StepAgent, UatRunner) wrap many emulator/observation/assertion operations
  LargeClass:
    active: true
    threshold: 600
    excludes:
      - '**/codegen/**'  # Codegen files may exceed for complex systems
      - '**/test/**'  # Test classes can be large with many test cases
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
    ignoreNestingFunctions: false
    nestingFunctions: []
    excludes:
      - '**/codegen/**'  # Codegen has complex when expressions
      - '**/ir/**'  # IR substitution/deepCopy inherently complex
      - '**/dsl/**'  # DSL stack-walking and recording context are inherently complex
      - '**/optimization/**'  # Optimization logic is complex
      - '**/validation/**'  # Validation has complex branching
      - '**/analysis/passes/**'  # Cross-subsystem polymorphic walks (parallel to '**/validation/**')
      - '**/collision/**'  # Collision math is complex
      - '**/intellij/completion/**'  # Completion type resolution checks many types
      - '**/mcp/**'  # MCP tool dispatch (registerEmulatorTools, batchAssert) branches over many tool types
      - '**/gradle/**'  # Gradle task execute() methods handle many pipeline paths (file-not-found, format variations, platform differences, error recovery) — complexity parallels codegen visitor dispatch. GbktPlugin.registerTasks() branches over 12+ task registration paths
  NestedBlockDepth:
    active: true
    threshold: 5  # DSL builders can be nested
    excludes:
      - '**/codegen/**'  # C code generation has deep nesting
      - '**/validation/**'  # Validation logic has deep nesting
      - '**/collision/**'  # Collision math has deep nesting

style:
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'  # Universal sentinel for "unset / auto-assign / not found" (Java/Kotlin API convention: optInt(key, -1), indexOf, etc.)
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'   # Minimum column-width formatting sentinel (e.g. "Scene".length); too small to warrant a named constant
      - '7'   # Ceil-to-byte-boundary rounding: (x + 7) / 8 == ceil(x / 8); universally recognised bit-arithmetic idiom
      - '8'
      - '10'  # Ubiquitous scale boundary: 1–10 difficulty/quality rating, decade multiplier; universally idiomatic
      - '14'  # GB dialog box default Y position in tiles; also common 4-bit pair (high nibble of 0xE_)
      - '16'
      - '18'  # Game Boy screen height in tiles: 144px / 8 = 18 tiles; universally idiomatic in GB development
      - '20'  # Game Boy screen width in tiles: 160px / 8 = 20 tiles; universally idiomatic in GB development
      - '24'  # ARGB alpha-channel bit-shift: (color shr 24) and 0xFF; standard ARGB component extraction idiom
      - '32'  # Game Boy BG map dimension: 32×32 tiles; also power-of-two shift value
      - '64'  # Audio priority LOW level; also common power-of-two buffer sentinel
      - '100' # Percentage calculations: value * 100 / total, coerceIn(0, 100); universally idiomatic
      - '128' # Audio priority MEDIUM level; also common power-of-two / signed-byte sentinel
      - '192' # Audio priority HIGH level; also common colour constant (3/4 of 255)
      - '255' # Maximum byte value: used in bit masking (and 255 or and 0xFF); universally idiomatic for byte extraction
      - '256' # Full byte-value count (0-255 inclusive); page size; also MBC5 ROM bank count — all are specification-level constants
      - '0xFF' # Hex form of 255; same rationale as '255' above — detekt compares literal text, not normalised value
      - '0x1F' # RGB555 5-bit channel mask: each colour channel occupies bits 0-4; standard bit-extraction idiom
      - '0x7FFF' # RGB555 maximum value (32767): 15 significant bits representing all-white; GBC colour-space boundary constant
      - '0xFFFF' # 16-bit address space maximum; universally idiomatic in embedded/Game Boy memory range guards
      - '1024' # Kilobyte conversion: bytes / 1024.0; universally idiomatic
    excludes:
      - '**/codegen/**'  # Codegen emits raw hardware constants (tile offsets, VRAM addresses, bit-masks) — a magic-number detector adds noise, not signal, in this layer
      - '**/test/**'  # Test fixtures use coordinate and tile-index literals that read as data, not magic — readability trumps extraction here
      - '**/AssetPipeline.kt'  # Dense RGB/GBC colour-pipeline constants: alpha threshold (128), luminance weights (0.299/0.587/0.114 — float), palette luminance steps (192/128/64/200/140/80), and RGB555↔RGB888 bit-scale shifts; extracting each to a named constant produces a 15-entry micro-constant companion that obscures the colour-science formulae rather than clarifying them
      - '**/FontCharacterMapping.kt'  # Font-encoding tables: raw glyph byte-offset sequences for ASCII characters; these are specification data tables, not extractable named constants — adding names would balloon the file without adding semantic value
      - '**/optimization/AnalyzedAsset.kt'  # Scoring-rubric constants: inter-related penalty weights (30/20/10/5) and grade thresholds (90/75/60/40) form a single calibrated rubric; extracting each to a named constant would create noise without improving readability, and the thresholds are only meaningful together
      - '**/PngValidator.kt'  # PNG specification byte offsets and magic bytes (IHDR chunk positions 12-15, width/height offsets 16/20, IHDR-data-size 13, png-sig-member 25): these are PNG-spec literals embedded inside a byte-array constant (PNG_SIGNATURE) and a spec-faithful IHDR parser; naming each offset individually would add 8 micro-constants without improving comprehension beyond the existing inline comments
      - '**/emulator/ui/**'  # Swing UI layout constants (pixel sizes, colours, font sizes, component dimensions) — same class as intellij-plugin UI constants; Swing API is pixel-oriented and every numeric argument is inherently context-specific to the parent container
      - '**/emulator/debug/**'  # Emulator debug subsystem: EMU_printf trap opcodes (0x52), CPU register bit positions, GBDK printf-buffer addresses, source-map offset arithmetic — domain-specific byte sequences that must not be renamed; identical rationale to codegen/** hardware constants
      - '**/emulator/agent/**'  # Agent API: VRAM tile layout constants (tile grid offsets, BG map width=32, tilemap address arithmetic), OAM slot byte offsets, screenshot comparison pixel-difference thresholds — dense hardware-addressed arithmetic where named constants would not reduce cognitive load
      - '**/emulator/CoffeeGbEmulator.kt'  # Coffee-GB wrapper: tick-count ceiling (maxTicksPerFrame), frame-timing constants, display-buffer size — emulation-loop implementation constants tightly coupled to Coffee-GB internals
      - '**/emulator/EmulatorConfig.kt'  # Emulator configuration defaults (timeout thresholds, frame limits) — inline defaults are more readable than a companion-object full of single-use constants
      - '**/dsl/**'  # DSL builder default values (physics parameters: gravity, terminal velocity, coyote frames, walk speed; camera defaults; platform crumble delays) are calibrated API defaults documented via KDoc; extracting them to companion-object constants would not reduce magic-number risk because the defaults are the design contract, not arbitrary choices
      - '**/intellij/**'  # IntelliJ plugin Swing UI: pixel dimensions, font sizes, colour component values, layout constants, ANSI-escape byte offsets, progress percentages, and GB-hardware display constants (160×144, tile sizes). Swing API is inherently pixel-oriented; every argument is layout-specific. Identical rationale to emulator/ui/** — naming each Dimension/Color argument to a companion constant would produce boilerplate that obscures intent rather than improving it
      - '**/examples/**'  # Example game sources: pixel positions, brick counts, score increments, spawn coordinates, and tile indices in game DSL files are game-design constants whose meaning is self-evident from context (e.g. position(72, 132) in a 160×144 screen); extracting each to a named constant would create boilerplate with no readability benefit in short single-file game definitions
      - '**/ir/Types.kt'  # GB cartridge hardware spec data table (Cartridge enum): MBC register byte codes (0x06, 0x11, 0x13, 0x19, 0x1B) and ROM bank counts (256 for MBC5) are authoritative Game Boy hardware constants from the Pan Docs spec; named per-entry extraction adds no semantic value beyond the enum member name itself
      - '**/ir/CoreTypes.kt'  # GBC colour-space spec data: RGB555 bit-field masks (0x1F per channel, 0x7FFF max), slot range sentinels (-1), and palette-size constraints (4 colors, 7 max slot); these are specification-boundary constants documented inline; extraction would create redundant companion names
      - '**/gradle/**'  # Gradle task numeric constants (process exit codes, timeout values, tool version thresholds) are build-toolchain-specific implementation details; same rationale as emulator/agent** — hardware-addressed arithmetic where named constants add noise
  UnusedPrivateMember:
    active: true
    excludes:
      - '**/dsl/**'  # DSL receiver lambdas (e.g. GameBuilder.kt) capture private members consumed by the receiver scope — kotlinc extension-receiver resolution marks them "unused" spuriously
      - '**/gradle/**'  # Gradle plugin test helpers (e.g. rgb888ToRgb555 in PalettePolarityWarningTest) are kept as future verification utilities — same forward-declaration rationale as intellij/** UnusedPrivateProperty exclusion. Internal plugin classes (ErrorEnhancer) carry named-capture-group properties that are forward-declared for structured error matching
  UnusedPrivateProperty:
    active: true
    excludes:
      - '**/dsl/**'  # DSL builders expose properties needed for API ergonomics; some are forward-declared for future DSL surface — suppressed to prevent premature removal
      - '**/test/**'  # Test DSL fixtures use property-delegate syntax (val z1 by zone {}, val dummySprite by metasprite {}) for side-effect registration; the delegate binding is required but the variable itself is not referenced — identical to the dsl/** exclusion rationale
      - '**/intellij/**'  # IntelliJ plugin: constructor params (EntityPreviewPanel.project, PoEditorPanel.project, GbktToolWindowPanel.project) are API-contract parameters accepted for future use (e.g. opening project-aware file dialogs, service lookups); removing them would break callers wired by IntelliJ's dependency injection. Detekt incorrectly classifies them as UnusedPrivateProperty even after removing the 'val' keyword
      - '**/gradle/**'  # Gradle plugin internal classes (ErrorEnhancer): named regex capture groups stored as private properties for structured error-text matching; forward-declared properties for planned structured reporting. Same rationale as intellij/** — API-contract forward-declarations
  UtilityClassWithPublicConstructor:
    active: true
    excludes:
      - '**/test/**'  # Test scaffold classes may have companion objects with constants but no instance test methods yet (Wave-0 pattern); detekt incorrectly flags them as "utility classes"
  ForbiddenComment:
    active: false  # TODO/FIXME are fine
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true  # KDoc tables and narrative comments aren't code; matches the package/import exclusions above
    excludeRawStrings: true
    excludes:
      - '**/test/**'  # Test files can have long assertion messages
      - '**/commonTest/**'
      - '**/codegen/**'  # Codegen files generate C code strings
      - '**/gradle/**'  # Gradle task string templates (CLI argument lists, diagnostic messages, error text with file paths) can exceed 120 chars when embedding full file paths, version strings, and multi-component tool arguments; same rationale as codegen/**
  UnusedParameter:
    active: true
    excludes:
      - '**/codegen/**'  # Callback parameters needed for interface compliance
      - '**/dsl/**'  # DSL callback parameters for future expansion
      - '**/rpg/**'  # Callback placeholders
      - '**/flow/**'  # Flow callback parameters
      - '**/ui/**'  # Menu callback parameters
      - '**/scene/**'  # Scene callback parameters
      - '**/gradle/**'  # JUnit @TempDir and Gradle TestKit parameters in integration tests follow JUnit5 injection conventions; the injected parameter must be declared even when only indirectly consumed via Gradle runner API
  WildcardImport:
    active: true
    excludes:
      - '**/test/**'  # Test files use wildcards for brevity
      - '**/commonTest/**'
      - '**/codegen/**'  # Codegen AST uses wildcard imports for the C AST type aliases
      - '**/gradle/**'  # Gradle plugin tasks use org.gradle.api.tasks.* wildcard — the Gradle API surface is idiomatic to import as a block when many Gradle annotations (@InputFile, @OutputDirectory, @TaskAction, etc.) are used in a single file
    excludeImports:
      - 'java.util.*'
      - 'kotlinx.coroutines.*'
      - 'kotlin.test.*'  # Allowed in test files for brevity
      - 'io.github.gbkt.core.dsl.*'  # Required for operator extension functions in game files
  ReturnCount:
    active: true
    max: 4
    excludedFunctions:
      - 'equals'
      - 'canAfford'  # Resource cost checking has multiple early returns
      - 'findWhileLoop'  # Recursive tree traversal in PathfindingCodegenTest
      - 'findRecursiveCall'  # Recursive tree traversal in PathfindingCodegenTest
    excludeLabeled: true
    excludeReturnFromLambda: true
    excludeGuardClauses: true
    excludes:
      - '**/intellij/completion/**'  # Completion providers need early returns for control flow
      - '**/intellij/navigation/**'  # Navigation handlers need early returns
      - '**/intellij/codegen/**'  # Codegen service has multiple return paths
      - '**/intellij/inspections/**'  # Inspection checks need early returns
      - '**/intellij/toolwindow/**'  # Tool window navigation handlers need early returns
      - '**/codegen/**'  # Visitor helpers use fail-fast validation pattern (each invalid input returns null); parallels intellij/codegen exclusion
      - '**/mcp/**'  # MCP tool handlers fail-fast on invalid input arguments (each returns CallToolResult error)
      - '**/gradle/**'  # Gradle task functions (e.g. findMgba path-finder) use early returns to probe multiple installation locations — fail-fast detection pattern; parallels intellij/navigation exclusion
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 1
    excludes:
      - '**/codegen/**'  # Complex loop-based C code generation
      - '**/AssetPipeline.kt'  # Asset parsing with early exits
      - '**/gradle/**'  # Gradle task and test loops (PNG chunk scanning, sprite-frame processing) use multiple break/continue to implement efficient skip-ahead iteration — idiomatic for binary-format parsing
  FunctionOnlyReturningConstant:
    active: true
    ignoreOverridableFunction: true
    ignoreActualFunction: true
    excludes:
      - '**/codegen/**'  # Codegen pattern matching returns null for no-match
  ThrowsCount:
    active: true
    max: 4
    excludeGuardClauses: true
    excludes:
      - '**/gradle/**'  # Gradle task execute() functions validate many preconditions (GBDK path, ROM size, file format, version) — each distinct failure mode requires its own exception; extracting to sub-functions would obscure the linear build-step validation chain

naming:
  InvalidPackageDeclaration:
    active: false  # Sample games may use simplified package structure
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'  # Allow u8(), i16(), etc.
    excludeClassPattern: '$^'
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
    privateVariablePattern: '(_)?[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'
    excludes:
      - '**/test/**'  # Test fixtures often use SCREAMING_SNAKE_CASE for tile/coord/map constants (TILE_WALL, RACER_MAP_W) that read as test data, not mutable state
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*'
    excludes:
      - '**/examples/**'  # Sample games' packages mirror their directory names; matches the InvalidPackageDeclaration exemption already documented in this file
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'

exceptions:
  InstanceOfCheckForException:
    active: true
    excludes:
      - '**/gradle/**'  # Gradle plugin wraps ProcessBuilder exceptions where the calling API throws a generic checked exception; instanceof-check is the only way to distinguish tool-not-found from process-execution-error without restructuring the reflection-based invocation chain
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'Exception'
      - 'IllegalMonitorStateException'
      - 'NullPointerException'
      - 'IndexOutOfBoundsException'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: '_|(ignore|expected).*'
    excludes:
      - '**/intellij/codegen/**'  # Codegen service catches exceptions at boundary
      - '**/mcp/**'  # MCP tool handlers catch broadly at protocol boundary — convert exceptions into JSON error responses
      - '**/emulator/**'  # Agent code catches broadly at IO/parse boundary (savestate IO, metadata parse, debug session)
      - '**/gradle/**'  # Gradle task implementations catch broadly at CLI boundary (ProcessBuilder, IOException from external tools) — converting exceptions to GradleException requires broad catch at the Gradle task API layer
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - 'Error'
      - 'Exception'
      - 'Throwable'
      - 'RuntimeException'
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
    allowedExceptionNameRegex: '_|(ignore|expected).*'
    excludes:
      - '**/gradle/**'  # Gradle task implementations swallow exceptions at sub-step boundaries and emit actionable Gradle build errors instead — swallowing is intentional at the tool-error-to-Gradle-exception translation layer

empty-blocks:
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'

potential-bugs:
  EqualsWithHashCodeExist:
    active: true
  InvalidRange:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  UselessPostfixExpression:
    active: true
  ImplicitDefaultLocale:
    active: true
    excludes:
      - '**/gradle/**'  # Gradle task diagnostic output (progress percentages, size ratios) uses implicit locale intentionally — these are developer-facing build log messages, not user-facing localizable strings; locale-neutral formatting would add noise without benefit
