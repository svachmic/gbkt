name: Kotlin

on:
  push:
    branches: [master]
    paths:
      - 'gbkt-ir/**'
      - 'gbkt-lang/**'
      - 'gbkt-engine/**'
      - 'gbkt-world/**'
      - 'gbkt-core/**'
      - 'gbkt-cli/**'
      - 'gbkt-gradle-plugin/**'
      - 'gbkt-backend-api/**'
      - 'gbkt-backend-gbdk/**'
      - 'gbkt-analysis/**'
      - 'gbkt-emulator/**'
      - 'gbkt-test/**'
      - 'gbkt-mcp-server/**'
      - 'gbkt-all/**'
      - 'gbkt-bom/**'
      - 'gbkt-genre-rpg/**'
      - 'gbkt-genre-platformer/**'
      - 'gbkt-genre-puzzle/**'
      - 'gbkt-genre-sport/**'
      - 'gbkt-examples/**'
      - 'gbkt-intellij-plugin/**'
      - 'buildSrc/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/kotlin.yml'
  pull_request:
    branches: [master]
    paths:
      - 'gbkt-ir/**'
      - 'gbkt-lang/**'
      - 'gbkt-engine/**'
      - 'gbkt-world/**'
      - 'gbkt-core/**'
      - 'gbkt-cli/**'
      - 'gbkt-gradle-plugin/**'
      - 'gbkt-backend-api/**'
      - 'gbkt-backend-gbdk/**'
      - 'gbkt-analysis/**'
      - 'gbkt-emulator/**'
      - 'gbkt-test/**'
      - 'gbkt-mcp-server/**'
      - 'gbkt-all/**'
      - 'gbkt-bom/**'
      - 'gbkt-genre-rpg/**'
      - 'gbkt-genre-platformer/**'
      - 'gbkt-genre-puzzle/**'
      - 'gbkt-genre-sport/**'
      - 'gbkt-examples/**'
      - 'gbkt-intellij-plugin/**'
      - 'buildSrc/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/kotlin.yml'

concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Publish library modules to mavenLocal
        run: |
          ./gradlew \
            :gbkt-ir:publishToMavenLocal \
            :gbkt-lang:publishToMavenLocal \
            :gbkt-engine:publishToMavenLocal \
            :gbkt-world:publishToMavenLocal \
            :gbkt-core:publishToMavenLocal \
            :gbkt-backend-api:publishToMavenLocal \
            :gbkt-backend-gbdk:publishToMavenLocal \
            :gbkt-emulator:publishToMavenLocal \
            :gbkt-analysis:publishToMavenLocal \
            :gbkt-genre-rpg:publishToMavenLocal \
            :gbkt-genre-platformer:publishToMavenLocal \
            :gbkt-genre-puzzle:publishToMavenLocal \
            :gbkt-genre-sport:publishToMavenLocal \
            --configure-on-demand --no-daemon

      - name: Build all modules
        run: |
          ./gradlew \
            :gbkt-core:build \
            :gbkt-cli:build \
            :gbkt-backend-api:build \
            :gbkt-backend-gbdk:build \
            :gbkt-intellij-plugin:build \
            :gbkt-examples:pong:build \
            :gbkt-examples:breakout:build \
            :gbkt-examples:simple-physics:build \
            :gbkt-examples:metasprites:build \
            :gbkt-examples:metasprites-stress:build \
            :gbkt-examples:banks:build \
            :gbkt-examples:platformer-template:build \
            --no-daemon

      - name: Run Tests
        run: ./gradlew :gbkt-core:test :gbkt-backend-api:test :gbkt-backend-gbdk:test :gbkt-gradle-plugin:test --no-daemon

      - name: Verify Example C Generation
        run: |
          ./gradlew \
            :gbkt-examples:pong:generateC \
            :gbkt-examples:breakout:generateC \
            :gbkt-examples:simple-physics:generateC \
            :gbkt-examples:metasprites:generateC \
            :gbkt-examples:metasprites-stress:generateC \
            :gbkt-examples:banks:generateC \
            :gbkt-examples:platformer-template:generateC \
            --no-daemon

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Publish library modules to mavenLocal
        run: |
          ./gradlew \
            :gbkt-ir:publishToMavenLocal \
            :gbkt-lang:publishToMavenLocal \
            :gbkt-engine:publishToMavenLocal \
            :gbkt-world:publishToMavenLocal \
            :gbkt-core:publishToMavenLocal \
            :gbkt-backend-api:publishToMavenLocal \
            :gbkt-backend-gbdk:publishToMavenLocal \
            :gbkt-emulator:publishToMavenLocal \
            :gbkt-analysis:publishToMavenLocal \
            :gbkt-genre-rpg:publishToMavenLocal \
            :gbkt-genre-platformer:publishToMavenLocal \
            :gbkt-genre-puzzle:publishToMavenLocal \
            :gbkt-genre-sport:publishToMavenLocal \
            --configure-on-demand --no-daemon

      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Publish library modules to mavenLocal
        run: |
          ./gradlew \
            :gbkt-ir:publishToMavenLocal \
            :gbkt-lang:publishToMavenLocal \
            :gbkt-engine:publishToMavenLocal \
            :gbkt-world:publishToMavenLocal \
            :gbkt-core:publishToMavenLocal \
            :gbkt-backend-api:publishToMavenLocal \
            :gbkt-backend-gbdk:publishToMavenLocal \
            :gbkt-emulator:publishToMavenLocal \
            :gbkt-analysis:publishToMavenLocal \
            :gbkt-genre-rpg:publishToMavenLocal \
            :gbkt-genre-platformer:publishToMavenLocal \
            :gbkt-genre-puzzle:publishToMavenLocal \
            :gbkt-genre-sport:publishToMavenLocal \
            --configure-on-demand --no-daemon

      - name: Check version consistency
        run: ./gradlew checkVersionConsistency --no-daemon
