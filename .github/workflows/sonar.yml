name: SonarCloud

on:
  push:
    branches: [master]
    paths:
      - 'gbkt-ir/**'
      - 'gbkt-lang/**'
      - 'gbkt-engine/**'
      - 'gbkt-world/**'
      - 'gbkt-core/**'
      - 'gbkt-cli/**'
      - 'gbkt-gradle-plugin/**'
      - 'gbkt-backend-api/**'
      - 'gbkt-backend-gbdk/**'
      - 'gbkt-analysis/**'
      - 'gbkt-emulator/**'
      - 'gbkt-test/**'
      - 'gbkt-mcp-server/**'
      - 'gbkt-all/**'
      - 'gbkt-bom/**'
      - 'gbkt-genre-rpg/**'
      - 'gbkt-genre-platformer/**'
      - 'gbkt-genre-puzzle/**'
      - 'gbkt-genre-sport/**'
      - 'buildSrc/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/sonar.yml'
  pull_request:
    branches: [master]
    paths:
      - 'gbkt-ir/**'
      - 'gbkt-lang/**'
      - 'gbkt-engine/**'
      - 'gbkt-world/**'
      - 'gbkt-core/**'
      - 'gbkt-cli/**'
      - 'gbkt-gradle-plugin/**'
      - 'gbkt-backend-api/**'
      - 'gbkt-backend-gbdk/**'
      - 'gbkt-analysis/**'
      - 'gbkt-emulator/**'
      - 'gbkt-test/**'
      - 'gbkt-mcp-server/**'
      - 'gbkt-all/**'
      - 'gbkt-bom/**'
      - 'gbkt-genre-rpg/**'
      - 'gbkt-genre-platformer/**'
      - 'gbkt-genre-puzzle/**'
      - 'gbkt-genre-sport/**'
      - 'buildSrc/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/sonar.yml'

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish library modules to mavenLocal
        run: |
          ./gradlew \
            :gbkt-ir:publishToMavenLocal \
            :gbkt-lang:publishToMavenLocal \
            :gbkt-engine:publishToMavenLocal \
            :gbkt-world:publishToMavenLocal \
            :gbkt-core:publishToMavenLocal \
            :gbkt-backend-api:publishToMavenLocal \
            :gbkt-backend-gbdk:publishToMavenLocal \
            :gbkt-emulator:publishToMavenLocal \
            :gbkt-analysis:publishToMavenLocal \
            :gbkt-genre-rpg:publishToMavenLocal \
            :gbkt-genre-platformer:publishToMavenLocal \
            :gbkt-genre-puzzle:publishToMavenLocal \
            :gbkt-genre-sport:publishToMavenLocal \
            --configure-on-demand --no-daemon

      - name: Run Kotlin tests with coverage
        run: ./gradlew :gbkt-core:test :gbkt-core:koverXmlReport --no-daemon

      - name: SonarCloud Scan
        run: ./gradlew  sonar --no-daemon
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
