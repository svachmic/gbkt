name: CodeQL

on:
  push:
    branches: [master, main]
    paths:
      - 'gbkt-core/**'
      - 'gbkt-cli/**'
      - 'gbkt-gradle-plugin/**'
      - 'gbkt-backend-api/**'
      - 'gbkt-backend-gbdk/**'
      - 'gbkt-bom/**'
      - '**.kt'
      - '**.kts'
  pull_request:
    branches: [master, main]
    paths:
      - 'gbkt-core/**'
      - 'gbkt-cli/**'
      - 'gbkt-gradle-plugin/**'
      - 'gbkt-backend-api/**'
      - 'gbkt-backend-gbdk/**'
      - 'gbkt-bom/**'
      - '**.kt'
      - '**.kts'
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    # CodeQL doesn't support Kotlin 2.3.0 yet (requires < 2.2.30)
    # Tracking: https://github.com/github/codeql/issues/20661
    continue-on-error: true
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: github/codeql-action/init@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          languages: java-kotlin

      - name: Build
        run: ./gradlew :gbkt-core:build :gbkt-cli:build :gbkt-backend-api:build :gbkt-backend-gbdk:build

      - uses: github/codeql-action/analyze@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
