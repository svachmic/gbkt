name: CodeQL

on:
  push:
    branches: [master, main]
    paths:
      - 'gbkt-core/**'
      - 'gbkt-cli/**'
      - 'gbkt-gradle-plugin/**'
      - 'gbkt-backend-api/**'
      - 'gbkt-backend-gbdk/**'
      - 'gbkt-bom/**'
      - '**.kt'
      - '**.kts'
  pull_request:
    branches: [master, main]
    paths:
      - 'gbkt-core/**'
      - 'gbkt-cli/**'
      - 'gbkt-gradle-plugin/**'
      - 'gbkt-backend-api/**'
      - 'gbkt-backend-gbdk/**'
      - 'gbkt-bom/**'
      - '**.kt'
      - '**.kts'
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: java-kotlin

      - name: Publish library modules to mavenLocal
        # Cold-mavenLocal bootstrap — configuring the build compiles the gbkt-gradle-plugin
        # included build, which resolves gbkt SNAPSHOTs from ~/.m2 (empty on a fresh runner).
        # Rooted task path + --configure-on-demand are load-bearing; see kotlin.yml.
        run: ./gradlew :publishConsumedModulesToMavenLocal --configure-on-demand

      - name: Build
        run: ./gradlew :gbkt-core:build :gbkt-cli:build :gbkt-backend-api:build :gbkt-backend-gbdk:build

      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
