gbktVersion=0.1.0

# JVM heap for the Gradle daemon and Kotlin compiler. A from-clean build recompiles all
# 20 modules at once; the default ~512 MB heap OOMs the Kotlin FIR compiler (GC overhead
# limit exceeded). Required for `./gradlew clean test pluginTest` to pass on a fresh
# checkout / CI. See .planning Phase 15 (v0.1.0 release gate).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g
