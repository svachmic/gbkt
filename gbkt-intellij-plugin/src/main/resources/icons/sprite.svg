<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Sprite icon - represents an 8x8 pixel grid -->
  <!-- Grid background -->
  <rect x="2" y="2" width="12" height="12" fill="#E5E7EB"/>
  <!-- Grid lines (8x8) -->
  <g stroke="#9CA3AF" stroke-width="0.3">
    <line x1="3.5" y1="2" x2="3.5" y2="14"/>
    <line x1="5" y1="2" x2="5" y2="14"/>
    <line x1="6.5" y1="2" x2="6.5" y2="14"/>
    <line x1="8" y1="2" x2="8" y2="14"/>
    <line x1="9.5" y1="2" x2="9.5" y2="14"/>
    <line x1="11" y1="2" x2="11" y2="14"/>
    <line x1="12.5" y1="2" x2="12.5" y2="14"/>
    <line x1="2" y1="3.5" x2="14" y2="3.5"/>
    <line x1="2" y1="5" x2="14" y2="5"/>
    <line x1="2" y1="6.5" x2="14" y2="6.5"/>
    <line x1="2" y1="8" x2="14" y2="8"/>
    <line x1="2" y1="9.5" x2="14" y2="9.5"/>
    <line x1="2" y1="11" x2="14" y2="11"/>
    <line x1="2" y1="12.5" x2="14" y2="12.5"/>
  </g>
  <!-- Sample pixels -->
  <rect x="5" y="3.5" width="1.5" height="1.5" fill="#374151"/>
  <rect x="9.5" y="3.5" width="1.5" height="1.5" fill="#374151"/>
  <rect x="6.5" y="6.5" width="3" height="1.5" fill="#374151"/>
  <rect x="5" y="9.5" width="1.5" height="1.5" fill="#374151"/>
  <rect x="9.5" y="9.5" width="1.5" height="1.5" fill="#374151"/>
  <!-- Border -->
  <rect x="2" y="2" width="12" height="12" fill="none" stroke="#6B7280" stroke-width="0.5"/>
</svg>
